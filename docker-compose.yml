version: '3.9'

services:
  ml:
    build: ./ml
    ports:
      - '5000:5000'
    env_file: ./ml/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s   # give the model time to load before first check

  backend:
    build: ./backend
    ports:
      - '3001:3001'
    env_file: ./backend/.env
    environment:
      # Override so the backend always reaches the ML container by name
      FLASK_SERVICE_URL: http://ml:5000
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - '3000:3000'
    env_file: ./web/.env
    depends_on:
      - backend
    restart: unless-stopped
